##############################################################################
#  V016 — Switch user authentication to Keycloak
#  - password_hash becomes nullable (Keycloak owns the credential)
#  - keycloak_sub added so we can key local users by Keycloak's stable subject
#  Depends on: V004 (users)
##############################################################################
databaseChangeLog:

  - changeSet:
      id: V016-password-hash-nullable
      author: aaseya
      changes:
        - dropNotNullConstraint:
            tableName: users
            columnName: password_hash
            columnDataType: VARCHAR(512)
      rollback:
        - addNotNullConstraint:
            tableName: users
            columnName: password_hash
            columnDataType: VARCHAR(512)

  - changeSet:
      id: V016-add-keycloak-sub
      author: aaseya
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: keycloak_sub
                  type: VARCHAR(64)
                  remarks: "Keycloak 'sub' claim — stable id for the Keycloak user"
        - createIndex:
            tableName: users
            indexName: uk_users_keycloak_sub
            unique: true
            columns:
              - column:
                  name: keycloak_sub
      rollback:
        - dropIndex:
            tableName: users
            indexName: uk_users_keycloak_sub
        - dropColumn:
            tableName: users
            columnName: keycloak_sub
