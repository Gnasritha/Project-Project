name: inspection_solution_modernization
description: "National Platform for Control and Inspection — Field Inspector mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  http_parser: ^4.1.2
  google_maps_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
