##############################################################################
#  Momthathel — Liquibase Master Changelog
#  Format  : YAML
#  Strategy: one file per table, ordered by FK dependency
##############################################################################
databaseChangeLog:

  # ── Independent / root tables (no FK dependencies) ──────────────────────
  - include:
      file: db/changelog/migrations/V001__create_roles.yaml
      relativeToChangelogFile: false

  - include:
      file: db/changelog/migrations/V002__create_inspection_type.yaml
      relativeToChangelogFile: false

  - include:
      file: db/changelog/migrations/V003__create_clause.yaml
      relativeToChangelogFile: false

  # ── Tables that depend on root tables ────────────────────────────────────
  - include:
      file: db/changelog/migrations/V004__create_users.yaml
      relativeToChangelogFile: false

  - include:
      file: db/changelog/migrations/V005__create_establishment.yaml
      relativeToChangelogFile: false

  # ── Tables that depend on establishment ──────────────────────────────────
  - include:
      file: db/changelog/migrations/V006__create_license.yaml
      relativeToChangelogFile: false

  # ── Central aggregate table ───────────────────────────────────────────────
  - include:
      file: db/changelog/migrations/V007__create_inspection_case.yaml
      relativeToChangelogFile: false

  # ── Child tables of inspection_case ──────────────────────────────────────
  - include:
      file: db/changelog/migrations/V008__create_attachments.yaml
      relativeToChangelogFile: false

  - include:
      file: db/changelog/migrations/V009__create_inspection_violation.yaml
      relativeToChangelogFile: false

  # ── Seed / reference data ────────────────────────────────────────────────
  - include:
      file: db/changelog/migrations/V010__seed_reference_data.yaml
      relativeToChangelogFile: false

  # ── Inspector ↔ Inspection Type authorisation mapping ────────────────────
  - include:
      file: db/changelog/migrations/V011__create_user_inspection_type.yaml
      relativeToChangelogFile: false

  # ── License type column for mobile license-entry screen ──────────────────
  - include:
      file: db/changelog/migrations/V012__add_license_type_to_license.yaml
      relativeToChangelogFile: false

  # ── Auth token columns for ISM-2 mobile-app login flow ───────────────────
  - include:
      file: db/changelog/migrations/V013__add_auth_token_to_users.yaml
      relativeToChangelogFile: false

  # ── ISIC activity catalogue for ISM-4 no-license facility flow ───────────
  - include:
      file: db/changelog/migrations/V014__create_isic_activity.yaml
      relativeToChangelogFile: false

  - include:
      file: db/changelog/migrations/V015__add_isic_to_establishment.yaml
      relativeToChangelogFile: false
