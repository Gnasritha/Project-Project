##############################################################################
#  V004 — Create USERS table
#  Depends on: V001 (roles)
##############################################################################
databaseChangeLog:

  - changeSet:
      id: V004-create-users
      author: aaseya
      changes:

        - createSequence:
            sequenceName: users_user_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: users
            remarks: "Inspectors and admin users of the inspection system"
            columns:

              - column:
                  name: user_id
                  type: BIGINT
                  defaultValueSequenceNext: users_user_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: role_id
                  type: BIGINT
                  remarks: "FK → roles.role_id"
                  constraints:
                    nullable: false

              - column:
                  name: employee_id
                  type: VARCHAR(100)

              - column:
                  name: full_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: mobile_number
                  type: VARCHAR(20)

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_username

              - column:
                  name: password_hash
                  type: VARCHAR(512)
                  constraints:
                    nullable: false

              - column:
                  name: language
                  type: VARCHAR(10)
                  remarks: "BCP-47 tag, e.g. en, ar"

              - column:
                  name: status
                  type: VARCHAR(50)
                  remarks: "ACTIVE | INACTIVE | SUSPENDED"

        # ── Foreign key: users → roles ────────────────────────────────────
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_user_role
            onDelete: RESTRICT
            onUpdate: CASCADE

        # ── Index on role_id for join performance ─────────────────────────
        - createIndex:
            tableName: users
            indexName: idx_users_role_id
            columns:
              - column:
                  name: role_id

      rollback:
        - dropTable:
            tableName: users
        - dropSequence:
            sequenceName: users_user_id_seq
